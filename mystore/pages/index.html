{%extends 'theme.html'%}
{%block main%}
<div class="container">
        <div class="row">
            {%for i in products%}
            <div class="col-lg-4">
                <div class="card mb-5 shadow"
                style="width: 18rem;height: 25rem;">
                    <div class="card-header">
                        <img src="{{i.image.url}}"
                        class="imagefluid">
                    </div>
                    <div class="card-body">
                        <h5>{{i.name}}</h5>
                        <h5>{{i.price}}</h5>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-outline-dark">
                            Add to Cart
                        </button>
                    </div>                   
                </div>
                {%endfor%} 
            </div>
        </div>
</div>
{%endblock%}
